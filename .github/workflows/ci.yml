name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerpilot
          POSTGRES_PASSWORD: ledgerpilot
          POSTGRES_DB: ledgerpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ledgerpilot:ledgerpilot@localhost:5432/ledgerpilot?schema=public
      TASKS_DRIVER: inline

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ledgerpilot/db generate

      - name: Push schema + apply RLS
        run: |
          pnpm --filter @ledgerpilot/db exec prisma db push --skip-generate
          psql "$DATABASE_URL" -f packages/db/prisma/sql/rls.sql
          pnpm --filter @ledgerpilot/db seed

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: End-to-end smoke test (offline AI)
        run: pnpm --filter @ledgerpilot/worker smoke

      - name: Unit tests
        run: |
          pnpm --filter @ledgerpilot/shared test
          pnpm --filter @ledgerpilot/ai test

      - name: Build API and worker for e2e
        run: |
          pnpm --filter @ledgerpilot/shared build
          pnpm --filter @ledgerpilot/ai build
          pnpm --filter @ledgerpilot/api build
          pnpm --filter @ledgerpilot/worker build

      - name: Start API and worker
        run: |
          DATABASE_URL="$DATABASE_URL" TASKS_DRIVER=inline DISABLE_AUTH=true WORKER_URL=http://127.0.0.1:8081 PORT=8080 node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          DATABASE_URL="$DATABASE_URL" TASKS_DRIVER=inline WORKER_PORT=8081 node apps/worker/dist/main.js > /tmp/worker.log 2>&1 &
          sleep 6
          curl -f http://127.0.0.1:8080/health
          curl -f http://127.0.0.1:8081/health

      - name: Playwright API e2e
        run: pnpm test:e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== API LOG ==="
          cat /tmp/api.log || true
          echo "=== WORKER LOG ==="
          cat /tmp/worker.log || true
