name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerpilot
          POSTGRES_PASSWORD: ledgerpilot
          POSTGRES_DB: ledgerpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ledgerpilot:ledgerpilot@localhost:5432/ledgerpilot?schema=public
      TASKS_DRIVER: inline

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ledgerpilot/db generate

      # Deliberately `migrate deploy` and not `db push`: this is exactly what runs
      # against production, so a broken or missing migration fails here instead of
      # during a deploy. RLS comes with the migrations.
      - name: Migrate database
        run: |
          psql "$DATABASE_URL" -f packages/db/prisma/sql/app-role.sql
          pnpm --filter @ledgerpilot/db exec prisma migrate deploy
          pnpm --filter @ledgerpilot/db seed

      - name: Check migrations match the schema
        run: |
          pnpm --filter @ledgerpilot/db exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code || {
              echo "schema.prisma has changes with no migration. Run: pnpm db:migrate"
              exit 1
            }

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: End-to-end smoke test (offline AI)
        run: pnpm --filter @ledgerpilot/worker smoke

      - name: Unit tests
        run: |
          pnpm --filter @ledgerpilot/shared test
          pnpm --filter @ledgerpilot/ai test
          pnpm --filter @ledgerpilot/api test:coverage
          pnpm --filter @ledgerpilot/web test:coverage

      - name: Build API and worker for e2e
        run: |
          pnpm --filter @ledgerpilot/shared build
          pnpm --filter @ledgerpilot/ai build
          pnpm --filter @ledgerpilot/api build
          pnpm --filter @ledgerpilot/worker build

      - name: Start API and worker
        env:
          INTAKE_HMAC_SECRET: dev-intake-secret-change-me
        run: |
          DATABASE_URL="$DATABASE_URL" TASKS_DRIVER=inline DISABLE_AUTH=true WORKER_URL=http://127.0.0.1:8081 INTAKE_HMAC_SECRET=dev-intake-secret-change-me PORT=8080 node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          DATABASE_URL="$DATABASE_URL" TASKS_DRIVER=inline WORKER_PORT=8081 node apps/worker/dist/main.js > /tmp/worker.log 2>&1 &
          sleep 6
          curl -f http://127.0.0.1:8080/health
          curl -f http://127.0.0.1:8081/health

      - name: Start web app
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
          DEV_ORG_ID: org_demo_printpro
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
          CLERK_SECRET_KEY: ''
          PORT: '3000'
          HOSTNAME: '127.0.0.1'
        run: |
          chmod +x scripts/start-web-e2e.sh
          ./scripts/start-web-e2e.sh > /tmp/web.log 2>&1 &
          sleep 5
          curl -f -o /dev/null -s -w "%{http_code}" http://127.0.0.1:3000/app | grep -E '^200$'

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Playwright e2e
        env:
          E2E_API_URL: http://127.0.0.1:8080
          E2E_WEB_URL: http://127.0.0.1:3000
          INTAKE_HMAC_SECRET: dev-intake-secret-change-me
        run: pnpm test:e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== API LOG ==="
          cat /tmp/api.log || true
          echo "=== WORKER LOG ==="
          cat /tmp/worker.log || true
          echo "=== WEB LOG ==="
          cat /tmp/web.log || true
